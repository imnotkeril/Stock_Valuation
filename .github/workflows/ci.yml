name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      STOCK_ANALYSIS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            StockAnalysisSystem/requirements.txt
            StockAnalysisSystem/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r StockAnalysisSystem/requirements.txt -r StockAnalysisSystem/requirements-dev.txt
      - name: Lint
        run: ruff check StockAnalysisSystem
      - name: Test
        run: pytest
